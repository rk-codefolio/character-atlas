plugins {
    id 'java-library'
    id 'jacoco'
}
group = 'dev.characteratlas'
version = '0.1.0'
def javaVersion = providers.gradleProperty('catalogJavaVersion').map { JavaLanguageVersion.of(it) }
java { toolchain { languageVersion = javaVersion.orElse(JavaLanguageVersion.of(25)) } }
repositories { mavenCentral() }
dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform() }

apply from: file("gradle/java-style.gradle")

jacoco { toolVersion = '0.8.16' }
