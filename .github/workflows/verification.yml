name: Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  java:
    name: Java tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: archipelago
          POSTGRES_USER: archipelago
          POSTGRES_PASSWORD: atlas-ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U archipelago -d archipelago"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run unit and integration tests and verify 90% line coverage
        working-directory: archipelago-app
        env:
          ATLAS_TEST_DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports[5432] }}/archipelago
          ARCHIPELAGO_DB_PASSWORD: atlas-ci
        run: ../catalog-core/gradlew --no-daemon check
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: java-verification-reports
          path: |
            catalog-core/build/reports/tests/test
            archipelago-app/build/reports/tests/test
            archipelago-app/build/reports/jacoco/combinedCoverageReport

  web:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: archipelago-app/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: archipelago-app/web/package-lock.json
      - run: npm ci
      - run: npm run build
