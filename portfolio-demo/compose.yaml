name: archipelago-catalog
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: archipelago
      POSTGRES_USER: archipelago
      POSTGRES_PASSWORD: ${ARCHIPELAGO_DB_PASSWORD:?Set ARCHIPELAGO_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "archipelago", "-d", "archipelago"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - catalog-db-v18:/var/lib/postgresql
  api:
    build:
      context: ..
      dockerfile: portfolio-demo/Dockerfile
    environment:
      ARCHIPELAGO_DB_PASSWORD: ${ARCHIPELAGO_DB_PASSWORD:?Set ARCHIPELAGO_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 3s
      timeout: 2s
      retries: 20
    tmpfs:
      - /tmp:size=64m
  web:
    build: ./web
    environment:
      CATALOG_API_ORIGIN: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ARCHIPELAGO_WEB_PORT:-3000}:3000"
volumes:
  catalog-db-v18:
