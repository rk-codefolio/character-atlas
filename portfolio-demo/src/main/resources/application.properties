spring.datasource.url=jdbc:postgresql://db:5432/archipelago
spring.datasource.username=archipelago
spring.datasource.password=${ARCHIPELAGO_DB_PASSWORD}
server.port=8080
server.error.include-message=never

spring.servlet.multipart.enabled=false

catalog.frontend-origin=${CATALOG_FRONTEND_ORIGIN:http://localhost:3000}
catalog.discord.client-id=${CATALOG_DISCORD_CLIENT_ID:}
catalog.discord.client-secret=${CATALOG_DISCORD_CLIENT_SECRET:}
catalog.discord.owner-id=${CATALOG_DISCORD_OWNER_ID:}
catalog.discord.moderator-ids=${CATALOG_DISCORD_MODERATOR_IDS:}
catalog.discord.report-webhook=${CATALOG_DISCORD_REPORT_WEBHOOK:}

server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=atlas_admin
server.servlet.session.cookie.path=/api
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${CATALOG_SECURE_COOKIE:false}

mybatis.type-handlers-package=dev.characteratlas.archipelago.shared.infrastructure
